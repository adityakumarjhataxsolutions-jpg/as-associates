<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A.S. & Associates | Tax, GST & Accounting Solutions</title>

<meta name="description" content="A.S. & Associates - Tax, GST, Accounting, Bookkeeping and Business Compliance Solutions.">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

:root{
    --bg:#050914;
    --bg2:#080f20;
    --card:#0c1529;
    --card2:#101c35;
    --border:#1b2b49;

    --gold:#d4af62;
    --gold2:#f0cf83;

    --blue:#3b82f6;
    --green:#25d366;

    --white:#f8fafc;
    --muted:#94a3b8;

    --shadow:0 25px 70px rgba(0,0,0,.45);
    --transition:.3s ease;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

body{
    background:
    radial-gradient(circle at 10% 10%,rgba(35,72,130,.16),transparent 30%),
    radial-gradient(circle at 90% 20%,rgba(212,175,98,.08),transparent 25%),
    var(--bg);
    color:var(--white);
    font-family:'Plus Jakarta Sans',sans-serif;
    line-height:1.6;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.025;
    background-image:
    linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);
    background-size:45px 45px;
    z-index:-1;
}

a{
    text-decoration:none;
    color:inherit;
}

button,input,textarea,select{
    font-family:inherit;
}

.container{
    width:min(1180px,92%);
    margin:auto;
}

/* ================= HEADER ================= */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;
    background:rgba(5,9,20,.78);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(212,175,98,.12);
}

.navbar{
    height:82px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo h1{
    font-size:1.25rem;
    letter-spacing:.8px;
    font-weight:800;
}

.logo span{
    display:block;
    color:var(--gold);
    font-size:.68rem;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-top:2px;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:27px;
    list-style:none;
}

.nav-links a{
    color:#c5cedc;
    font-size:.88rem;
    transition:var(--transition);
}

.nav-links a:hover{
    color:var(--gold2);
}

.btn-nav{
    padding:10px 18px;
    border-radius:7px;
    background:linear-gradient(135deg,var(--gold2),var(--gold));
    color:#101010!important;
    font-weight:700;
    box-shadow:0 7px 25px rgba(212,175,98,.15);
}

.hamburger{
    display:none;
    width:45px;
    height:42px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--card);
    color:white;
    font-size:1.2rem;
}

/* ================= HERO ================= */

.hero{
    min-height:760px;
    padding:170px 0 100px;
    position:relative;
    overflow:hidden;
}

.hero::after{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    right:-180px;
    top:80px;
    background:rgba(212,175,98,.08);
    filter:blur(100px);
    border-radius:50%;
    pointer-events:none;
}

.hero-grid{
    display:grid;
    grid-template-columns:1.05fr .95fr;
    gap:70px;
    align-items:center;
}

.eyebrow{
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:8px 13px;
    border:1px solid rgba(212,175,98,.25);
    background:rgba(212,175,98,.06);
    border-radius:30px;
    color:var(--gold2);
    font-size:.75rem;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:23px;
}

.eyebrow i{
    font-size:.65rem;
}

.hero h2{
    font-size:clamp(2.4rem,5vw,4.25rem);
    line-height:1.08;
    letter-spacing:-2px;
    margin-bottom:24px;
}

.hero h2 span{
    color:var(--gold2);
}

.hero p{
    color:var(--muted);
    max-width:650px;
    font-size:1.08rem;
    margin-bottom:32px;
}

.hero-buttons{
    display:flex;
    gap:13px;
    flex-wrap:wrap;
}

.btn-primary{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    padding:14px 24px;
    border:0;
    border-radius:8px;
    background:linear-gradient(135deg,var(--gold2),var(--gold));
    color:#0b0d12;
    font-weight:800;
    cursor:pointer;
    transition:var(--transition);
}

.btn-primary:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 30px rgba(212,175,98,.2);
}

.btn-secondary{
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:13px 23px;
    border:1px solid var(--border);
    border-radius:8px;
    background:rgba(255,255,255,.02);
    color:white;
    font-weight:700;
    cursor:pointer;
    transition:var(--transition);
}

.btn-secondary:hover{
    border-color:var(--gold);
    color:var(--gold2);
}

/* ================= DASHBOARD ================= */

.dashboard{
    position:relative;
    background:linear-gradient(145deg,#101b32,#091222);
    border:1px solid #243758;
    border-radius:20px;
    padding:22px;
    box-shadow:var(--shadow);
    transform:perspective(1000px) rotateY(-3deg);
}

.dashboard::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:20px;
    background:linear-gradient(135deg,rgba(212,175,98,.25),transparent 35%,rgba(59,130,246,.12));
    pointer-events:none;
}

.dash-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
}

.dash-title{
    font-size:.85rem;
    color:var(--muted);
}

.dash-title strong{
    display:block;
    color:white;
    font-size:1.1rem;
    margin-top:3px;
}

.dash-status{
    display:flex;
    align-items:center;
    gap:6px;
    color:#9fe8bd;
    font-size:.7rem;
    padding:6px 9px;
    background:rgba(37,211,102,.08);
    border:1px solid rgba(37,211,102,.15);
    border-radius:20px;
}

.dash-status span{
    width:6px;
    height:6px;
    background:#25d366;
    border-radius:50%;
}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.stat{
    padding:18px;
    background:rgba(255,255,255,.035);
    border:1px solid var(--border);
    border-radius:12px;
}

.stat small{
    color:var(--muted);
    font-size:.7rem;
}

.stat strong{
    display:block;
    font-size:1.3rem;
    margin-top:5px;
}

.stat i{
    color:var(--gold);
    float:right;
}

.chart{
    margin-top:14px;
    padding:20px;
    background:rgba(255,255,255,.025);
    border:1px solid var(--border);
    border-radius:12px;
}

.chart-header{
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    font-size:.72rem;
    margin-bottom:15px;
}

.chart-bars{
    height:105px;
    display:flex;
    align-items:end;
    justify-content:space-around;
    gap:9px;
}

.bar{
    width:9%;
    border-radius:5px 5px 2px 2px;
    background:linear-gradient(to top,var(--gold),#f3d991);
    opacity:.9;
}

.b1{height:38%}
.b2{height:58%}
.b3{height:47%}
.b4{height:72%}
.b5{height:65%}
.b6{height:87%}
.b7{height:76%}
.b8{height:96%}

.dashboard-footer{
    margin-top:14px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.mini-box{
    text-align:center;
    padding:12px 5px;
    border:1px solid var(--border);
    border-radius:9px;
    background:rgba(255,255,255,.02);
}

.mini-box i{
    color:var(--gold);
    margin-bottom:5px;
}

.mini-box span{
    display:block;
    color:var(--muted);
    font-size:.65rem;
}

/* ================= SECTIONS ================= */

section{
    padding:105px 0;
}

.section-dark{
    background:linear-gradient(180deg,rgba(255,255,255,.018),rgba(255,255,255,.035));
    border-top:1px solid rgba(255,255,255,.035);
    border-bottom:1px solid rgba(255,255,255,.035);
}

.section-head{
    text-align:center;
    max-width:720px;
    margin:0 auto 50px;
}

.section-tag{
    color:var(--gold);
    font-size:.72rem;
    letter-spacing:2px;
    text-transform:uppercase;
    font-weight:800;
    margin-bottom:9px;
}

.section-head h2{
    font-size:2.35rem;
    line-height:1.2;
    margin-bottom:13px;
}

.section-head p{
    color:var(--muted);
}

/* ================= TRUST STRIP ================= */

.trust{
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
    background:#070d19;
}

.trust-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
}

.trust-item{
    padding:27px 20px;
    text-align:center;
    border-right:1px solid var(--border);
}

.trust-item:last-child{
    border-right:0;
}

.trust-item i{
    color:var(--gold);
    font-size:1.3rem;
    margin-bottom:7px;
}

.trust-item strong{
    display:block;
    font-size:.9rem;
}

.trust-item span{
    color:var(--muted);
    font-size:.7rem;
}

/* ================= SERVICES ================= */

.search{
    max-width:570px;
    margin:0 auto 40px;
    position:relative;
}

.search input{
    width:100%;
    padding:16px 20px 16px 48px;
    background:var(--card);
    border:1px solid var(--border);
    color:white;
    border-radius:50px;
    outline:none;
}

.search i{
    position:absolute;
    left:20px;
    top:50%;
    transform:translateY(-50%);
    color:var(--gold);
}

.services{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.service{
    position:relative;
    overflow:hidden;
    padding:28px 24px;
    background:linear-gradient(145deg,#0d172b,#09111f);
    border:1px solid var(--border);
    border-radius:15px;
    transition:var(--transition);
}

.service::after{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    right:-50px;
    top:-50px;
    background:rgba(212,175,98,.07);
    border-radius:50%;
}

.service:hover{
    transform:translateY(-7px);
    border-color:rgba(212,175,98,.6);
    box-shadow:0 20px 45px rgba(0,0,0,.35);
}

.service-icon{
    width:48px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:11px;
    background:rgba(212,175,98,.08);
    border:1px solid rgba(212,175,98,.18);
    color:var(--gold2);
    font-size:1.2rem;
    margin-bottom:19px;
}

.service h3{
    font-size:1rem;
    margin-bottom:9px;
}

.service p{
    color:var(--muted);
    font-size:.8rem;
    line-height:1.7;
    margin-bottom:17px;
}

.service a{
    color:var(--gold2);
    font-size:.75rem;
    font-weight:700;
}

/* ================= ABOUT ================= */

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:50px;
    align-items:center;
}

.about-text h2{
    font-size:2.4rem;
    margin-bottom:20px;
}

.about-text p{
    color:var(--muted);
    margin-bottom:17px;
}

.about-points{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:25px;
}

.about-point{
    padding:14px;
    border:1px solid var(--border);
    border-radius:9px;
    background:rgba(255,255,255,.02);
}

.about-point i{
    color:var(--gold);
    margin-right:7px;
}

.about-point span{
    font-size:.78rem;
}

.about-panel{
    padding:30px;
    background:linear-gradient(145deg,#101c34,#091120);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:var(--shadow);
}

.about-panel-title{
    color:var(--gold);
    font-size:.75rem;
    letter-spacing:1px;
    margin-bottom:20px;
}

.progress{
    margin-bottom:19px;
}

.progress-top{
    display:flex;
    justify-content:space-between;
    font-size:.75rem;
    margin-bottom:7px;
}

.progress-top span:last-child{
    color:var(--gold);
}

.progress-line{
    height:7px;
    background:#17243b;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    border-radius:20px;
    background:linear-gradient(90deg,var(--gold),var(--gold2));
}

.fill1{width:92%}
.fill2{width:86%}
.fill3{width:95%}
.fill4{width:89%}

/* ================= FOUNDERS ================= */

.founders{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.founder{
    padding:35px 25px;
    text-align:center;
    background:linear-gradient(145deg,#0d172b,#09111f);
    border:1px solid var(--border);
    border-radius:16px;
    transition:var(--transition);
}

.founder:hover{
    transform:translateY(-5px);
    border-color:rgba(212,175,98,.5);
}

.founder.lead{
    border-color:var(--gold);
    box-shadow:0 15px 50px rgba(212,175,98,.08);
}

.avatar{
    width:80px;
    height:80px;
    margin:0 auto 18px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(145deg,#172746,#0c1528);
    border:1px solid rgba(212,175,98,.3);
    color:var(--gold2);
    font-size:1.7rem;
}

.founder h3{
    font-size:1.1rem;
}

.role{
    color:var(--gold);
    font-size:.75rem;
    font-weight:700;
    margin:5px 0 13px;
}

.founder p{
    color:var(--muted);
    font-size:.78rem;
}

/* ================= WHY ================= */

.why{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:17px;
}

.why-card{
    padding:25px;
    background:rgba(255,255,255,.025);
    border:1px solid var(--border);
    border-radius:13px;
}

.why-card i{
    color:var(--gold);
    font-size:1.3rem;
    margin-bottom:15px;
}

.why-card h3{
    font-size:.95rem;
    margin-bottom:8px;
}

.why-card p{
    color:var(--muted);
    font-size:.76rem;
}

/* ================= STEPS ================= */

.steps{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.step{
    text-align:center;
    padding:28px 20px;
    border:1px solid var(--border);
    background:var(--card);
    border-radius:14px;
}

.step-number{
    color:var(--gold);
    font-size:1.7rem;
    font-weight:800;
    margin-bottom:10px;
}

.step h3{
    font-size:.95rem;
    margin-bottom:8px;
}

.step p{
    color:var(--muted);
    font-size:.75rem;
}

/* ================= KNOWLEDGE ================= */

.blog{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.blog-card{
    padding:28px;
    border:1px solid var(--border);
    border-radius:14px;
    background:linear-gradient(145deg,#0e182c,#09111f);
}

.blog-label{
    color:var(--gold);
    font-size:.68rem;
    font-weight:800;
    letter-spacing:1px;
}

.blog-card h3{
    font-size:1rem;
    margin:13px 0;
}

.blog-card p{
    color:var(--muted);
    font-size:.78rem;
}

/* ================= CONTACT ================= */

.contact-box{
    display:grid;
    grid-template-columns:.85fr 1.15fr;
    gap:45px;
    padding:45px;
    border:1px solid var(--border);
    border-radius:20px;
    background:linear-gradient(145deg,#0d172b,#09111f);
    box-shadow:var(--shadow);
}

.contact-info h2{
    font-size:2.1rem;
    margin-bottom:15px;
}

.contact-info>p{
    color:var(--muted);
    margin-bottom:28px;
}

.contact-item{
    display:flex;
    gap:14px;
    align-items:center;
    margin:18px 0;
}

.contact-item i{
    color:var(--gold);
    width:20px;
}

.contact-item span{
    font-size:.82rem;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.form-group{
    margin-bottom:15px;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    display:block;
    color:var(--muted);
    font-size:.72rem;
    margin-bottom:7px;
}

input,select,textarea{
    width:100%;
    padding:13px 15px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#060c18;
    color:white;
    outline:none;
}

input:focus,select:focus,textarea:focus{
    border-color:var(--gold);
}

/* ================= FOOTER ================= */

footer{
    background:#03060d;
    border-top:1px solid var(--border);
    padding:65px 0 25px;
}

.footer-grid{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;
    gap:35px;
    margin-bottom:45px;
}

.footer-col h4{
    color:var(--gold);
    margin-bottom:16px;
    font-size:.85rem;
}

.footer-col p,
.footer-col a{
    color:var(--muted);
    font-size:.75rem;
}

.footer-col ul{
    list-style:none;
}

.footer-col li{
    margin:9px 0;
}

.footer-bottom{
    border-top:1px solid var(--border);
    padding-top:22px;
    text-align:center;
    color:#64748b;
    font-size:.7rem;
}

/* ================= FLOATING ================= */

.floating{
    position:fixed;
    right:20px;
    bottom:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
    z-index:900;
}

.float-btn{
    width:53px;
    height:53px;
    border:0;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:1.3rem;
    cursor:pointer;
    box-shadow:0 8px 25px rgba(0,0,0,.4);
    transition:var(--transition);
}

.float-btn:hover{
    transform:scale(1.1);
}

.whatsapp{
    background:#25d366;
}

.call{
    background:#2563eb;
}

/* ================= DRAWER ================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(5px);
    opacity:0;
    visibility:hidden;
    z-index:1400;
    transition:.3s;
}

.overlay.active{
    opacity:1;
    visibility:visible;
}

.drawer{
    position:fixed;
    top:0;
    right:-330px;
    width:310px;
    height:100%;
    background:#091225;
    border-left:1px solid var(--border);
    z-index:1500;
    padding:28px 22px;
    transition:.35s;
}

.drawer.active{
    right:0;
}

.drawer-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-bottom:20px;
    border-bottom:1px solid var(--border);
}

.close{
    background:none;
    border:0;
    color:white;
    font-size:1.4rem;
}

.drawer-links{
    list-style:none;
    margin-top:25px;
}

.drawer-links li{
    margin:20px 0;
}

.drawer-links a{
    display:flex;
    gap:12px;
    color:#dbe4f0;
}

.drawer-links i{
    color:var(--gold);
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.8);
    backdrop-filter:blur(7px);
    z-index:2000;
}

.modal.active{
    display:flex;
}

.modal-content{
    width:min(450px,92%);
    background:#0b1528;
    border:1px solid var(--gold);
    border-radius:17px;
    padding:30px;
    position:relative;
}

.modal-content h2{
    font-size:1.3rem;
    margin-bottom:8px;
}

.modal-content>p{
    color:var(--muted);
    font-size:.75rem;
    margin-bottom:20px;
}

.modal-close{
    position:absolute;
    right:17px;
    top:15px;
    background:none;
    border:0;
    color:var(--muted);
    font-size:1.2rem;
}

.contact-option{
    display:flex;
    align-items:center;
    justify-content:space-between;
