<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.S. & Associates | Tax, GST & Accounting Solutions</title>
    <meta name="description" content="Professional tax, GST registration & return filing, bookkeeping, accounting, and business compliance services by A.S. & Associates. Expert guidance for individuals and businesses.">
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #070d1b;
            --card-bg: #0f1c3f;
            --card-border: #1e295c;
            --gold: #c5a059;
            --gold-light: #dfbe7d;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header & Navigation */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(7, 13, 27, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            z-index: 1000;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 85px;
        }

        .logo h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        .logo span {
            display: block;
            font-size: 0.75rem;
            color: var(--gold);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links a {
            font-size: 0.95rem;
            color: var(--text-muted);
            transition: var(--transition);
            position: relative;
        }

        .nav-links a:not(.btn-consultation):hover {
            color: var(--gold);
        }

        .btn-consultation {
            background: linear-gradient(135deg, var(--gold), #997833);
            color: #000;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.2);
        }

        .btn-consultation:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }

        /* Modern Side Menu / Drawer */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1500;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .side-drawer {
            position: fixed;
            top: 0;
            right: -320px;
            width: 300px;
            height: 100%;
            background: var(--card-bg);
            border-left: 1px solid var(--card-border);
            z-index: 1600;
            display: flex;
            flex-direction: column;
            padding: 30px 25px;
            transition: var(--transition);
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }

        .side-drawer.active {
            right: 0;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 15px;
        }

        .drawer-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .drawer-close:hover {
            color: var(--gold);
        }

        .drawer-links {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .drawer-links a {
            font-size: 1.05rem;
            color: var(--text-main);
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .drawer-links a i {
            color: var(--gold);
            font-size: 1.1rem;
            width: 24px;
        }

        .drawer-links a:hover {
            color: var(--gold);
            transform: translateX(5px);
        }

        .hamburger {
            display: none;
            cursor: pointer;
            font-size: 1.6rem;
            color: var(--text-main);
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 8px 12px;
            border-radius: 6px;
            transition: var(--transition);
        }

        /* Hero Section */
        .hero {
            padding: 180px 0 120px;
            background: radial-gradient(circle at top right, #11224d, var(--bg-color));
            position: relative;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 50px;
            align-items: center;
        }

        .hero-content h2 {
            font-size: 3.2rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .hero-content h2 span {
            color: var(--gold);
        }

        .hero-content p {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-bottom: 35px;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: var(--gold);
            color: #000;
            padding: 14px 28px;
            font-weight: 600;
            border-radius: 6px;
            transition: var(--transition);
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.2);
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 14px 28px;
            font-weight: 600;
            border-radius: 6px;
            transition: var(--transition);
            cursor: pointer;
        }

        .btn-secondary:hover {
            border-color: var(--gold);
            color: var(--gold);
            transform: translateY(-2px);
        }

        .hero-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .hero-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--gold);
        }

        .hero-card ul {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .hero-card li {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.05rem;
        }

        .hero-card i {
            color: var(--gold);
            font-size: 1.2rem;
        }

        /* Section Commons */
        section {
            padding: 100px 0;
        }

        .section-header {
            text-align: center;
            max-width: 750px;
            margin: 0 auto 50px;
        }

        .section-header h2 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Search Bar Box Style */
        .search-container {
            max-width: 600px;
            margin: 0 auto 40px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 30px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .search-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.15);
        }

        .search-container i {
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            color: var(--gold);
            font-size: 1.1rem;
        }

        /* Intro Section */
        .intro-section {
            background: var(--card-bg);
            border-top: 1px solid var(--card-border);
            border-bottom: 1px solid var(--card-border);
            text-align: center;
            padding: 70px 0;
        }

        .intro-section p {
            font-size: 1.25rem;
            max-width: 950px;
            margin: 0 auto;
            color: var(--text-main);
            line-height: 1.8;
        }

        /* Services Grid */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 30px;
        }

        .service-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 35px 30px;
            border-radius: 12px;
            transition: var(--transition);
            position: relative;
        }

        .service-card:hover {
            border-color: var(--gold);
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .service-card .icon {
            font-size: 2.2rem;
            color: var(--gold);
            margin-bottom: 20px;
        }

        .service-card h3 {
            font-size: 1.3rem;
            margin-bottom: 12px;
        }

        .service-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .service-link {
            color: var(--gold);
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* About Section */
        .about-box {
            max-width: 900px; 
            margin: 0 auto; 
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 50px;
            border-radius: 16px;
            color: var(--text-muted); 
            font-size: 1.1rem; 
            display: flex; 
            flex-direction: column; 
            gap: 20px;
        }

        /* Founders Section */
        .founders-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 35px;
        }

        .founder-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 45px 30px;
            text-align: center;
            position: relative;
            transition: var(--transition);
        }

        .founder-card.lead {
            border: 2px solid var(--gold);
            background: linear-gradient(180deg, #13224d, var(--card-bg));
        }

        .badge-lead {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--gold);
            color: #000;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 5px 15px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .founder-avatar {
            width: 100px;
            height: 100px;
            background: var(--card-border);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            color: var(--gold);
        }

        .founder-card h3 {
            font-size: 1.4rem;
            margin-bottom: 5px;
        }

        .founder-role {
            color: var(--gold);
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .founder-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Why Choose Us & Steps */
        .why-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }

        .why-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 30px;
            border-radius: 10px;
        }

        .why-item h4 {
            font-size: 1.2rem;
            margin-bottom: 12px;
            color: var(--gold);
        }

        .why-item p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .steps-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .step-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 35px 25px;
            border-radius: 12px;
            text-align: center;
        }

        .step-number {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 15px;
        }

        .step-card h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .step-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Contact & Lead Section */
        .contact-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 55px;
        }

        .contact-info h3 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .contact-info p {
            color: var(--text-muted);
            margin-bottom: 35px;
            font-size: 1.05rem;
        }

        .contact-details {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .contact-item i {
            font-size: 1.4rem;
            color: var(--gold);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--gold);
        }

        /* Footer */
        footer {
            background: #040812;
            border-top: 1px solid var(--card-border);
            padding: 70px 0 35px;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 40px;
            margin-bottom: 50px;
        }

        .footer-col h4 {
            font-size: 1.15rem;
            margin-bottom: 20px;
            color: var(--gold);
        }

        .footer-col ul {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .footer-col a {
            color: var(--text-muted);
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .footer-col a:hover {
            color: var(--gold);
        }

        .footer-bottom {
            border-top: 1px solid var(--card-border);
            padding-top: 30px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Floating WhatsApp & Call Buttons */
        .floating-actions {
            position: fixed;
            bottom: 25px;
            right: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 999;
        }

        .float-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #fff;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            transition: var(--transition);
            cursor: pointer;
            border: none;
        }

        .float-whatsapp { background: #25d366; }
        .float-call { background: var(--accent-blue); }
        .float-btn:hover { transform: scale(1.12); }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--gold);
            padding: 35px;
            border-radius: 16px;
            width: 90%;
            max-width: 460px;
            text-align: center;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 18px;
            right: 18px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            cursor: pointer;
        }

        .contact-option-box {
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            padding: 16px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
